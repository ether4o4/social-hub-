name: Social Hub Android CI

on:
  push:
    paths:
      - 'social-hub-android.zip'
      - '.github/workflows/extract-and-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        run: |
          test -f social-hub-android.zip
          unzip -o social-hub-android.zip
          rm social-hub-android.zip
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Normalize Android build configuration
        run: |
          sed -i '/id("org.jetbrains.kotlin.plugin.compose")/d' app/build.gradle.kts
          sed -i '/android:icon=/d;/android:roundIcon=/d' app/src/main/AndroidManifest.xml

      - name: Repair Kotlin source
        run: |
          sed -i 's/AnimatedVisibility(/androidx.compose.animation.AnimatedVisibility(/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i '/^package com.example.socialhub.ui$/a import com.example.socialhub.ui.components.FeedCard' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/viewModel\.showFilter = !viewModel\.showFilter/viewModel.toggleFilter()/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/viewModel\.showFilter = false/viewModel.closeDropdowns()/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/\.Up\b/.KeyboardArrowUp/g' app/src/main/java/com/example/socialhub/ui/SocialHubOverlay.kt
          sed -i '/^package com.example.socialhub.ui$/a import androidx.compose.material.icons.filled.KeyboardArrowUp\nimport kotlin.math.roundToInt' app/src/main/java/com/example/socialhub/ui/SocialHubOverlay.kt
          ! grep -R -nE 'Icons\.[A-Za-z0-9_.]+\.Up\b' app/src/main/java || true

      - name: Persist canonical source tree
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts gradle.properties settings.gradle.kts app .github/workflows/extract-and-build.yml
          if git diff --cached --quiet; then
            echo "Canonical source already current."
          else
            git commit -m "chore: promote Android source to canonical project tree"
            git push
          fi

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install required SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: social-hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: socialhub-${{ github.run_number }}
          name: Social Hub ${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
