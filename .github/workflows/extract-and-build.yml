name: Extract and Build Android

on:
  push:
    paths:
      - 'social-hub-android.zip'
      - '.github/workflows/extract-and-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  extract-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        run: |
          test -f social-hub-android.zip
          unzip -o social-hub-android.zip
          rm social-hub-android.zip
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Normalize Android build configuration
        run: |
          sed -i '/id("org.jetbrains.kotlin.plugin.compose")/d' app/build.gradle.kts
          sed -i '/android:icon=/d;/android:roundIcon=/d' app/src/main/AndroidManifest.xml

      - name: Repair Social Hub Kotlin sources
        run: |
          sed -i 's/AnimatedVisibility(/androidx.compose.animation.AnimatedVisibility(/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i '/^package com.example.socialhub.ui$/a import com.example.socialhub.ui.components.FeedCard' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/viewModel\.showFilter = !viewModel\.showFilter/viewModel.toggleFilter()/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/viewModel\.showFilter = false/viewModel.closeDropdowns()/g' app/src/main/java/com/example/socialhub/ui/SocialHubFeed.kt
          sed -i 's/Icons\.Default\.Up/Icons.Filled.KeyboardArrowUp/g' app/src/main/java/com/example/socialhub/ui/SocialHubOverlay.kt
          sed -i 's/Icons\.Default\.KeyboardArrowUp/Icons.Filled.KeyboardArrowUp/g' app/src/main/java/com/example/socialhub/ui/SocialHubOverlay.kt
          sed -i '/^package com.example.socialhub.ui$/a import androidx.compose.material.icons.filled.KeyboardArrowUp\nimport kotlin.math.roundToInt' app/src/main/java/com/example/socialhub/ui/SocialHubOverlay.kt

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit extracted project
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted project changes to commit."
          else
            git commit -m "Extract Social Hub Android project and build APK"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: social-hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
